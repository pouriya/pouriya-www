[package]
name = "pouriya-www"
version = "0.3.1"
edition = "2024"
description = "pouriya.net source code"
authors = ["Pouriya Jahanbakhsh <pouriya.jahanbakhsh@gmail.com>"]
license = "MIT"
# Edition 2024 and let-chains.
rust-version = "1.90"

[dependencies]
# The HTTP server and routes, plain HTTP behind a reverse proxy. `json` is the
# API bodies, `matched-path` is the route template on the access log.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "matched-path",
    "query",
] }

tokio = { version = "1.53.3", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "signal",
] }

# The front end (`--www`), with Range, Last-Modified and conditional requests
# handled for us; `set-header` for its Cache-Control.
tower-http = { version = "0.6.11", default-features = false, features = [
    "fs",
    "set-header",
] }

# Devices and visits, one row per event. `bundled` compiles SQLite from
# source: no libsqlite3-dev on the host, same version everywhere.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# `#[derive]` for the API bodies.
serde = { version = "1.0.229", features = ["derive"] }

# The 80 random bits of a ULID, straight from the OS; also the salt of the
# admin password hash and the admin session tokens.
getrandom = "0.4.3"

# The admin password: `--admin-hash` is an argon2 PHC string, made by
# `pouriya-www hash`. The salt comes from getrandom above, not its own RNG.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }

# The required flags, the logging flags and the `hash` subcommand.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# The picture of characters that guards the email, no audio.
captcha = { version = "1.0.0", default-features = false }

anyhow = "1.0"

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "json",
] }

[profile.release]
opt-level = 'z'     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
